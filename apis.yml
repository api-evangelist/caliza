aid: caliza

name: Caliza

description: Caliza is a financial infrastructure company providing compliant, real-time cross-border payments and USD account infrastructure
  for global businesses. The Caliza Core API lets integrators create individual and business beneficiaries (with KYC/KYB verification), issue
  named USD digital-dollar and multi-currency virtual accounts, simulate and execute transactions and payments across fiat and stablecoin rails
  (ACH, WIRE, SWIFT, RTP, PIX, SPEI, and blockchain networks including Ethereum, Polygon, Tron, Stellar, Base and Solana), run batch and sweep
  payouts, lock FX rates, manage recipients, and receive HMAC-signed webhook notifications for the full transaction and beneficiary lifecycle.
  Authentication is OAuth 2.0 (OpenID Connect / Keycloak) and a full sandbox environment with mock deposit simulators is provided. Caliza is backed
  by Initialized Capital and QED Investors.

