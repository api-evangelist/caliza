tags:
- name: Terms and Conditions V1
  description: Retrieve the current terms & conditions document and record user acceptance. Use these endpoints to present legal terms to users and store auditable acceptance (timestamp, IP, version) required for compliance.
paths:
  /v1/terms-and-conditions:
    get:
      tags:
      - Terms and Conditions V1
      summary: Retrieve terms and conditions document
      description: Retrieves the current version of the platform's terms and conditions document in PDF or HTML format. The response includes the version number and effective date for compliance tracking and audit purposes. Use this to display terms to users before they accept, or to retrieve the specific version that a user accepted for regulatory record-keeping.
      operationId: getTermsAndConditions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string
                format: binary
components:
  securitySchemes:
    bearerAuth:
      type: http
      description: 'JWT Bearer token authentication. Include your access token in the Authorization header:


        `Authorization: Bearer YOUR_ACCESS_TOKEN`


        Tokens are obtained through the Caliza authentication flow and typically expire after 24 hours.

        Refresh your token before expiration to maintain uninterrupted access.

        '
      scheme: bearer
      bearerFormat: JWT
