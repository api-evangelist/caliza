openapi: 3.2.0
info:
  title: Caliza API documentation reference Related Person API
  description: The Caliza API enables seamless integration of financial services including payments, payouts, currency conversions, and compliance workflows.
  version: v1
  contact:
    name: Caliza API Support
    email: api-support@caliza.com
    url: https://docs.caliza.com
  termsOfService: https://caliza.com/terms
servers:
- url: https://api.sandbox.com
  description: Sandbox Environment
- url: https://api.caliza.com
  description: Production Environment
- url: https://api.sandbox.caliza.com
  description: Sandbox Environment (backoffice)
security:
- bearerAuth: []
tags:
- name: Related Person
  description: Manage related persons (e.g. beneficial owners, directors, representatives) linked to a beneficiary. Create, retrieve, update, list and delete related persons and upload supporting identity documents for compliance verification.
paths:
  /v1/beneficiaries/{beneficiaryId}/related-persons:
    post:
      tags:
      - Related Person
      summary: Create related person
      description: Creates a new related person for a beneficiary such as a beneficial owner, director, legal representative, or authorized signatory. Provide personal details including name, date of birth, citizenship, government ID, contact information, and residential address. Related persons are required for KYB compliance to identify individuals who own or control the beneficiary entity.
      operationId: createRelatedPerson
      parameters:
      - name: beneficiaryId
        in: path
        description: Unique identifier of the beneficiary to add the related person to.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelatedPersonResponse'
    get:
      tags:
      - Related Person
      summary: List related persons
      description: Retrieves all related persons associated with a beneficiary including beneficial owners, directors, legal representatives, and authorized signatories. Each entry includes full personal details, contact information, and address. Use this to review compliance information or display all individuals linked to a business beneficiary.
      operationId: listRelatedPersons
      parameters:
      - name: beneficiaryId
        in: path
        description: Unique identifier of the beneficiary to list related persons for.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RelatedPersonResponse'
  /v1/beneficiaries/{beneficiaryId}/related-persons/{id}:
    get:
      tags:
      - Related Person
      summary: Get related person
      description: Retrieves detailed information about a specific related person including personal details, contact information, residential address, and any uploaded compliance documents. Use this to inspect individual related person records for verification or compliance review.
      operationId: getRelatedPerson
      parameters:
      - name: beneficiaryId
        in: path
        description: Unique identifier of the beneficiary.
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: Unique identifier of the related person.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelatedPersonResponse'
    put:
      tags:
      - Related Person
      summary: Update related person
      description: Updates the information of an existing related person including personal details, contact information, and residential address. Use this when a related person's information changes or when correcting previously submitted data during the compliance review process.
      operationId: updateRelatedPerson
      parameters:
      - name: beneficiaryId
        in: path
        description: Unique identifier of the beneficiary.
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: Unique identifier of the related person to update.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelatedPersonResponse'
    delete:
      tags:
      - Related Person
      summary: Delete related person
      description: Removes a related person from a beneficiary's record. Use this when a related person is no longer associated with the beneficiary entity, for example when an owner sells their stake or a director resigns.
      operationId: deleteRelatedPerson
      parameters:
      - name: beneficiaryId
        in: path
        description: Unique identifier of the beneficiary.
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: Unique identifier of the related person to delete.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
  /v1/beneficiaries/{beneficiaryId}/related-persons/{id}/documents:
    post:
      tags:
      - Related Person
      summary: Upload document for related person
      description: Uploads an identity or compliance document for a specific related person of a beneficiary. Documents can include government-issued IDs (passport, driver's license, national ID), proof of address, or other verification documents. Provide the front of the document as required, and optionally the back. Supported formats include JPG, PNG, and PDF.
      operationId: addRelatedPersonDocument
      parameters:
      - name: beneficiaryId
        in: path
        description: Unique identifier of the beneficiary.
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: Unique identifier of the related person.
        required: true
        schema:
          type: string
      - name: name
        in: query
        description: Display name or filename for the document being uploaded.
        required: true
        schema:
          type: string
      - name: type
        in: query
        description: Type of identity or compliance document.
        required: true
        schema:
          type: string
          enum:
          - PASSPORT
          - DRIVER_LICENSE
          - NATIONAL_ID
          - PAN_CARD
          - ID_CARD
          - VOTER_ID_CARD
          - RESIDENT_CARD
          - ID_FRONT
          - ID_BACK
          - INCORPORATION_CERTIFICATE
          - TAX_REGISTRATION
          - BUSINESS_BANK_ACCOUNT
          - PROOF_OF_ADDRESS
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - documentFront
              type: object
              properties:
                documentFront:
                  type: string
                  format: binary
                  description: Front side of the document.
                documentBack:
                  type: string
                  format: binary
                  description: Back side of the document (optional).
      responses:
        '201':
          description: Created
components:
  schemas:
    AddressRequest:
      required:
      - city
      - country
      - state
      - streetOne
      - zipcode
      type: object
      description: Physical address request format for beneficiary or integrator registration.
      properties:
        streetOne:
          maxLength: 100
          minLength: 0
          type: string
        streetTwo:
          maxLength: 100
          minLength: 0
          type: string
        geolocation:
          type: string
        city:
          maxLength: 100
          minLength: 0
          type: string
        zipcode:
          type: string
        state:
          maxLength: 3
          minLength: 0
          type: string
        country:
          maxLength: 2
          minLength: 0
          type: string
    AddressEntity:
      type: object
      description: Physical address information with geolocation support.
      properties:
        streetOne:
          type: string
          description: Primary street address line.
          example: 123 Main Street
        streetTwo:
          type: string
          description: Secondary address line (apartment, suite, etc.).
          example: Apt 4B
        geolocation:
          type: string
          description: Geographic coordinates or location identifier.
          example: 40.7128,-74.0060
        city:
          type: string
          description: City name.
          example: New York
        zipcode:
          type: string
          description: Postal or ZIP code.
          example: '10001'
        state:
          type: string
          description: State or province.
          example: NY
        country:
          type: string
          description: Country name or ISO code.
          example: United States
    PersonRequest:
      required:
      - address
      - citizenship
      - dateOfBirth
      - email
      - firstName
      - idNumber
      - lastName
      - phoneNumber
      type: object
      description: Individual person information for beneficiary registration including identity documents, contact details, and compliance information.
      properties:
        firstName:
          maxLength: 100
          minLength: 0
          type: string
        lastName:
          maxLength: 100
          minLength: 0
          type: string
        dateOfBirth:
          type: string
          format: date
        placeOfBirth:
          type: string
        citizenship:
          type: string
        idNumber:
          type: string
        email:
          type: string
        phoneNumber:
          maxLength: 21
          minLength: 0
          pattern: ^(\+)[0-9\s.]{6,20}$
          type: string
        profession:
          type: string
        gender:
          type: string
          enum:
          - MALE
          - FEMALE
