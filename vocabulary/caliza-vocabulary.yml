  terms:
  - term: Transaction V1
    definition: 'Create, simulate, inspect and manage financial transactions. Includes endpoints to create transactions and simulations, retrieve
      transaction details, update metadata (e.g. blockchain hashes), export results, and run batch or sweep payouts. Use these for the full transaction
      lifecycle: preview costs, execute, and track status.'
    tags:
    - Resource Group
    source: openapi/caliza-api-documentation-reference-openapi.yml
  - term: Transaction V1 Sandbox
    definition: Sandbox-only transaction utilities for integration and testing. Simulate deposits, payouts and webhook notifications (PIX, SPEI,
      USD, etc.) without real funds to validate integration behavior and webhook handling.
    tags:
    - Resource Group
    source: openapi/caliza-api-documentation-reference-openapi.yml
  - term: Payment V1
    definition: 'Payment-specific operations: create payments, attach supporting documents, set/update payment blockchain hashes and retrieve
      payment instructions. Use these when initiating or inspecting single payment flows and their required documentation.'
    tags:
    - Resource Group
    source: openapi/caliza-api-documentation-reference-openapi.yml
  - term: Beneficiary V1
    definition: Manage beneficiaries (individuals and businesses) and their related resources. Endpoints cover creating, updating, enabling/disabling,
      deleting beneficiaries, managing wallets, virtual accounts, files, balances and recording terms acceptance. Use these to onboard and maintain
      pay-in/payout recipients.
    tags:
    - Resource Group
    source: openapi/caliza-api-documentation-reference-openapi.yml
  - term: Related Person
    definition: Manage related persons (e.g. beneficial owners, directors, representatives) linked to a beneficiary. Create, retrieve, update,
      list and delete related persons and upload supporting identity documents for compliance verification.
    tags:
    - Resource Group
    source: openapi/caliza-api-documentation-reference-openapi.yml
  - term: Integrator V1
    definition: 'Integrator-level configuration and profile endpoints: manage integrator profile, credentials, webhook configuration and secrets,
      view integrator balances and perform integrator-scoped operations.'
    tags:
    - Resource Group
    source: openapi/caliza-api-documentation-reference-openapi.yml
  - term: Integrator Capabilities V1
    definition: Inspect and list the set of capabilities/features enabled for an integrator account (supported currencies, payment rails, transaction
      types, limits and special features). Useful to adapt client behavior to account permissions.
    tags:
    - Resource Group
    source: openapi/caliza-api-documentation-reference-openapi.yml
  - term: Recipient V1
    definition: Manage saved payment recipients used as payout destinations. Create, retrieve, update, list and delete recipient profiles including
      bank/crypto details and verification metadata.
    tags:
    - Resource Group
    source: openapi/caliza-api-documentation-reference-openapi.yml
  - term: Travel Rule V1
    definition: Crypto Travel Rule compliance endpoints. Collect wallet ownership proofs for self-hosted (non-custodial) wallet recipients — via
      wallet signature or microtransfer (Satoshi test) — and retrieve the Travel Rule information a depositor's VASP needs to originate the Travel
      Rule message for an inbound crypto deposit.
    tags:
    - Resource Group
    source: openapi/caliza-api-documentation-reference-openapi.yml
  - term: KYC/KYB V1
    definition: Manage KYC (Know Your Customer) and KYB (Know Your Business) verification for beneficiaries. Create interactive verification sessions
      that redirect users to a third-party provider and track verification status.
    tags:
    - Resource Group
    source: openapi/caliza-api-documentation-reference-openapi.yml
  - term: Terms and Conditions V1
    definition: Retrieve the current terms & conditions document and record user acceptance. Use these endpoints to present legal terms to users
      and store auditable acceptance (timestamp, IP, version) required for compliance.
    tags:
    - Resource Group
    source: openapi/caliza-api-documentation-reference-openapi.yml
